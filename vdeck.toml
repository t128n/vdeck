# vDeck 3x3 configuration
# Numpad: 7 8 9 (row 1), 4 5 6 (row 2), 1 2 3 (row 3)
# Numpad 0 toggles the deck in the bottom-right corner of the cursor's monitor.
# Invariants:
# - Home is always the root (one Back from any context page).
# - Back always occupies bottom-left (Numpad 1) on every context/utilities page.
# - One layer per context by default; unused slots stay empty.

reset_grace_ms = 2000

[[plugins]]
id = "win11"
command = "uv"
args = ["run", "python", "plugins/core_win11.py"]

[plugins.config]
notes_app = "obsidian"
# obsidian_vault = ""
capture_app = "sharex"
# sharex_path = ""

[[plugins]]
id = "github"
command = "uv"
args = ["run", "python", "plugins/github.py"]
# config = { hostname = "github.com" }

[[plugins]]
id = "powertoys"
command = "uv"
args = ["run", "python", "plugins/powertoys.py"]

[[plugins]]
id = "teams"
command = "uv"
args = ["run", "python", "plugins/teams.py"]

[[plugins]]
id = "rdp"
command = "uv"
args = ["run", "python", "plugins/rdp.py", "--stdio"]
  [[plugins.config.groups]]
  name = "Lab"
  accent = "cyan"
  username = "user"
  password = "test"
  servers = [
    { name = "Test VM", host = "172.26.152.187" },
  ]

